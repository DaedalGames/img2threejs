name: Plugin catalog sync

# Keeps the README plugin table equal to the live img2 catalog (scripts/ci/plugin_table.py).
# Stdlib Python + the preinstalled gh CLI only; no third-party actions beyond checkout/setup-python.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [catalog-updated]
  pull_request:
    paths:
      - README.md
      - scripts/ci/plugin_table.py

permissions:
  contents: read

jobs:
  drift-warning:
    # Non-blocking: reports drift as a warning annotation, never fails the PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check README plugin table against the catalog
        run: |
          python3 scripts/ci/plugin_table.py --check \
            || echo "::warning file=README.md::Plugin table differs from the live catalog; the daily sync opens an issue; run scripts/ci/plugin_table.py --write to refresh it."

  sync:
    # Actions may not create PRs in this repo, so drift is reported as an issue
    # (one open issue, updated in place); a maintainer runs --write and opens the PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "README plugin table is out of date with the img2 catalog"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 scripts/ci/plugin_table.py --write
      - name: Open or update the drift issue
        run: |
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            -q ".[] | select(.title == env.TITLE) | .number" | head -1)
          if git diff --quiet -- README.md; then
            echo "README already matches the catalog"
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "README matches the catalog again."
            fi
            exit 0
          fi
          {
            echo "The plugin table in README.md no longer matches the live img2 catalog."
            echo
            echo "To fix: \`python3 scripts/ci/plugin_table.py --write\`, then open a PR with the README change."
            echo
            echo '```diff'
            git diff -- README.md
            echo '```'
          } > body.md
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
