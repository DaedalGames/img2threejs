name: Plugin catalog sync

# Keeps the README plugin table equal to the live img2 catalog (scripts/ci/plugin_table.py).
# Stdlib Python + the preinstalled gh CLI only; no third-party actions beyond checkout/setup-python.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [catalog-updated]
  pull_request:
    paths:
      - README.md
      - scripts/ci/plugin_table.py

permissions:
  contents: read

jobs:
  drift-warning:
    # Non-blocking: reports drift as a warning annotation, never fails the PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check README plugin table against the catalog
        run: |
          python3 scripts/ci/plugin_table.py --check \
            || echo "::warning file=README.md::Plugin table differs from the live catalog; the daily sync PR (branch bot/plugin-catalog-sync) will refresh it."

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: bot/plugin-catalog-sync
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 scripts/ci/plugin_table.py --write
      - name: Open or update the sync PR
        run: |
          if git diff --quiet -- README.md; then
            echo "README already matches the catalog"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add README.md
          git commit -m "docs: sync README plugin table with the catalog"
          git push --force origin "$BRANCH"
          body="Regenerated by \`scripts/ci/plugin_table.py --write\` from the live catalog."
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -qx OPEN; then
            echo "PR already open; branch updated"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "docs: sync README plugin table with the catalog" --body "$body"
          fi
